<svg xmlns="http://www.w3.org/2000/svg" width="680" height="500" viewBox="0 0 680 500" role="img"><title>bNMF pipeline: variant selection</title><desc>Discovery and primary GWAS feed four steps: collect significant variants, filter against the primary GWAS, remove HLA then clump and LD-prune, giving sentinel variants. The filter step also writes to the QC report.</desc><style>text{font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif}.th{font-size:14px;font-weight:600}.ts{font-size:12px}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="0.5" y="0.5" width="679" height="499" rx="12" fill="#FFFFFF" stroke="#D3D1C7"/>
<rect x="70" y="20" width="220" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text class="th" x="180.0" y="40" text-anchor="middle" dominant-baseline="central" fill="#444441">Discovery GWAS</text><text class="ts" x="180.0" y="58" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">one or more, any ancestry</text>
<rect x="410" y="20" width="220" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text class="th" x="520.0" y="40" text-anchor="middle" dominant-baseline="central" fill="#444441">Primary GWAS</text><text class="ts" x="520.0" y="58" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">largest study</text>
<line x1="180" y1="76" x2="250" y2="114" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="200" y="116" width="280" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text class="th" x="340.0" y="136" text-anchor="middle" dominant-baseline="central" fill="#3C3489">Collect significant variants</text><text class="ts" x="340.0" y="154" text-anchor="middle" dominant-baseline="central" fill="#534AB7">P below cutoff in any GWAS</text>
<line x1="340" y1="172" x2="340" y2="210" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M520 76 V240 H482" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="200" y="212" width="280" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text class="th" x="340.0" y="232" text-anchor="middle" dominant-baseline="central" fill="#3C3489">Filter against primary GWAS</text><text class="ts" x="340.0" y="250" text-anchor="middle" dominant-baseline="central" fill="#534AB7">P at most 0.05, same risk allele</text>
<line x1="198" y1="240" x2="172" y2="240" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="20" y="212" width="150" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text class="th" x="95.0" y="232" text-anchor="middle" dominant-baseline="central" fill="#444441">QC report</text><text class="ts" x="95.0" y="250" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">drops, agreement</text>
<line x1="340" y1="268" x2="340" y2="306" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="200" y="308" width="280" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text class="th" x="340.0" y="328" text-anchor="middle" dominant-baseline="central" fill="#3C3489">Remove HLA, clump, LD-prune</text><text class="ts" x="340.0" y="346" text-anchor="middle" dominant-baseline="central" fill="#534AB7">100 kb clump, LDlink SNPclip</text>
<line x1="340" y1="364" x2="340" y2="402" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="200" y="404" width="280" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text class="th" x="340.0" y="424" text-anchor="middle" dominant-baseline="central" fill="#085041">Sentinel variants</text><text class="ts" x="340.0" y="442" text-anchor="middle" dominant-baseline="central" fill="#0F6E56">independent, pass all filters</text>
</svg>
