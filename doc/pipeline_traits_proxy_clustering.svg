<svg xmlns="http://www.w3.org/2000/svg" width="680" height="880" viewBox="0 0 680 880" role="img"><title>bNMF pipeline: traits, proxies and clustering</title><desc>Sentinels get trait z-scores and trait filters. Flagged sentinels go through a four-step proxy search; others bypass it. The final variant set is imputed and clustered with bNMF, followed by optional post-hoc analysis. The QC report is written after the final set and after bNMF.</desc><style>text{font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif}.th{font-size:14px;font-weight:600}.ts{font-size:12px}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="0.5" y="0.5" width="679" height="879" rx="12" fill="#FFFFFF" stroke="#D3D1C7"/>
<rect x="200" y="20" width="280" height="44" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text class="th" x="340.0" y="42.0" text-anchor="middle" dominant-baseline="central" fill="#085041">Sentinel variants</text>
<line x1="340" y1="64" x2="340" y2="92" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="200" y="94" width="280" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text class="th" x="340.0" y="114" text-anchor="middle" dominant-baseline="central" fill="#3C3489">Fetch trait z-scores</text><text class="ts" x="340.0" y="132" text-anchor="middle" dominant-baseline="central" fill="#534AB7">parallel, checkpointed</text>
<line x1="340" y1="150" x2="340" y2="178" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="200" y="180" width="280" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text class="th" x="340.0" y="200" text-anchor="middle" dominant-baseline="central" fill="#3C3489">Filter traits</text><text class="ts" x="340.0" y="218" text-anchor="middle" dominant-baseline="central" fill="#534AB7">median N, missingness</text>
<line x1="340" y1="236" x2="340" y2="264" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="200" y="266" width="280" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text class="th" x="340.0" y="286" text-anchor="middle" dominant-baseline="central" fill="#3C3489">Flag sentinels needing a proxy</text><text class="ts" x="340.0" y="304" text-anchor="middle" dominant-baseline="central" fill="#534AB7">strand-ambiguous or low coverage</text>
<path d="M198 294 H24 V556 H198" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<text class="ts" x="30" y="284" text-anchor="start" fill="#5F5E5A">not flagged</text>
<line x1="340" y1="322" x2="340" y2="346" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="60" y="348" width="560" height="152" rx="12" fill="none" stroke="#888780" stroke-width="1" stroke-dasharray="4 3"/>
<text class="th" x="340" y="372" text-anchor="middle" fill="#2C2C2A">Proxy search, flagged sentinels only</text>
<rect x="76" y="388" width="116" height="64" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text class="th" x="134.0" y="408" text-anchor="middle" dominant-baseline="central" fill="#3C3489">LD partners</text><text class="ts" x="134.0" y="426" text-anchor="middle" dominant-baseline="central" fill="#534AB7">LDlink, r2 0.8</text>
<rect x="212" y="388" width="116" height="64" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text class="th" x="270.0" y="408" text-anchor="middle" dominant-baseline="central" fill="#3C3489">Primary rules</text><text class="ts" x="270.0" y="426" text-anchor="middle" dominant-baseline="central" fill="#534AB7">P, risk allele</text>
<rect x="348" y="388" width="116" height="64" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text class="th" x="406.0" y="408" text-anchor="middle" dominant-baseline="central" fill="#3C3489">Fetch traits</text><text class="ts" x="406.0" y="426" text-anchor="middle" dominant-baseline="central" fill="#534AB7">kept traits only</text>
<rect x="484" y="388" width="120" height="64" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text class="th" x="544.0" y="408" text-anchor="middle" dominant-baseline="central" fill="#3C3489">Pick best</text><text class="ts" x="544.0" y="426" text-anchor="middle" dominant-baseline="central" fill="#534AB7">strongest LD</text>
<line x1="193" y1="420" x2="210" y2="420" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="329" y1="420" x2="346" y2="420" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="465" y1="420" x2="482" y2="420" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<text class="ts" x="340" y="482" text-anchor="middle" fill="#5F5E5A">No proxy found: sentinel is dropped</text>
<line x1="340" y1="500" x2="340" y2="526" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="200" y="528" width="280" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text class="th" x="340.0" y="548" text-anchor="middle" dominant-baseline="central" fill="#085041">Final variant set</text><text class="ts" x="340.0" y="566" text-anchor="middle" dominant-baseline="central" fill="#0F6E56">originals plus proxies</text>
<line x1="482" y1="556" x2="518" y2="556" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="520" y="528" width="130" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text class="th" x="585.0" y="548" text-anchor="middle" dominant-baseline="central" fill="#444441">QC report</text><text class="ts" x="585.0" y="566" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">written twice</text>
<line x1="340" y1="584" x2="340" y2="612" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="190" y="614" width="300" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text class="th" x="340.0" y="634" text-anchor="middle" dominant-baseline="central" fill="#3C3489">Impute and filter traits</text><text class="ts" x="340.0" y="652" text-anchor="middle" dominant-baseline="central" fill="#534AB7">softImpute, drop correlated traits</text>
<line x1="340" y1="670" x2="340" y2="698" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="200" y="700" width="280" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text class="th" x="340.0" y="720" text-anchor="middle" dominant-baseline="central" fill="#3C3489">bNMF clustering</text><text class="ts" x="340.0" y="738" text-anchor="middle" dominant-baseline="central" fill="#534AB7">repeated runs, K by vote</text>
<path d="M482 728 H585 V586" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="340" y1="756" x2="340" y2="784" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="200" y="786" width="280" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text class="th" x="340.0" y="806" text-anchor="middle" dominant-baseline="central" fill="#085041">Post-hoc and reports</text><text class="ts" x="340.0" y="824" text-anchor="middle" dominant-baseline="central" fill="#0F6E56">genes, liftover, HTML (optional)</text>
</svg>
